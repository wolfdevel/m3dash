# Portainer: Stacks -> Add stack -> "Repository" (baut das Image aus diesem Ordner)
# oder lokal: docker compose up -d --build
services:
  dashboard:
    build: .
    image: smarthome-dashboard:latest
    container_name: smarthome-dashboard
    restart: unless-stopped
    ports:
      # DASHBOARD_PORT: Port, unter dem das Dashboard erreichbar ist (Standard 8080)
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
    volumes:
      - dashboard-data:/data
    environment:
      TZ: Europe/Vienna
      PORT: ${DASHBOARD_PORT:-8080}
      # Erster Admin (nur beim allerersten Start verwendet)
      ADMIN_USER: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-bitte-aendern}
      # optional, sonst wird einer erzeugt und in /data abgelegt
      SECRET_KEY: ${SECRET_KEY:-}

      # MQTT-Broker
      MQTT_HOST: ${MQTT_HOST:-mqtt3}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_SUBSCRIBE: ${MQTT_SUBSCRIBE:-#}
      # Schalter senden auf PRÄFIX + Subtopic je Schalter (z.B. m3dash/stat/stehlampe)
      MQTT_COMMAND_PREFIX: ${MQTT_COMMAND_PREFIX:-m3dash/stat/}
      # Schaltflächen dürfen nur hierhin publizieren
      MQTT_PUBLISH_ALLOW: ${MQTT_PUBLISH_ALLOW:-m3dash/stat/#}

      # FHEM-DbLog-Datenbank = Quelle "fhem": aktuelle Werte (Tabelle current) und Diagramme (history).
      # Lesender Benutzer genügt (SELECT auf current und history). Weitere Quellen: Verwaltung > Quellen.
      DB_BACKEND: ${DB_BACKEND:-mysql}   # mysql (auch MariaDB), postgresql oder sqlite
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}              # leer = 3306 bzw. 5432
      DB_NAME: ${DB_NAME:-fhem}
      DB_USER: ${DB_USER:-dashboard_ro}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CURRENT_INTERVAL: ${CURRENT_INTERVAL:-10}   # Sekunden zwischen zwei Abfragen von current
      # Nur SQLite: Datei als Volume einbinden und hier den Pfad im Container angeben, z.B. /fhem/fhem.db
      # DB_PATH: /fhem/fhem.db
      # Optional: eigenes SQL (Standard: FHEM-Tabellen current/history, siehe README)
      # HISTORY_QUERY: ...
      # CURRENT_QUERY: ...

volumes:
  dashboard-data:
